// Postbox backend defaults. Every value can be overridden by an environment
// variable via the optional substitution on the following line:
//   PORT, JWT_SECRET, SQLITE_PATH, DATA_DIR,
//   POSTBOX_CARRIER_<ID>_<KEY> (e.g. POSTBOX_CARRIER_DHL_MIN_REQUEST_INTERVAL_MS),
//   POSTBOX_REFRESH_STALE_AFTER_MINUTES, POSTBOX_REFRESH_MAX_CONCURRENT_PROBES,
//   POSTBOX_REFRESH_DELIVERED_GRACE_DAYS
postbox {
  http {
    host = "0.0.0.0"
    port = 8080
    port = ${?PORT}
  }
  jwt {
    // Dev-only default — MUST be overridden via JWT_SECRET in any real deployment.
    secret = "dev-only-insecure-secret-change-me"
    secret = ${?JWT_SECRET}
  }
  storage {
    sqlitePath = "data/postbox.db"
    sqlitePath = ${?SQLITE_PATH}
    dataDir = "data"
    dataDir = ${?DATA_DIR}
  }
  refresh {
    // On-demand refresh tuning: how stale a parcel must be before an app open
    // refreshes it from its carrier, how many carrier probes may be in flight
    // at once, and the grace window after which a DELIVERED parcel skips
    // refresh entirely.
    staleAfterMinutes = 30
    staleAfterMinutes = ${?POSTBOX_REFRESH_STALE_AFTER_MINUTES}
    maxConcurrentProbes = 4
    maxConcurrentProbes = ${?POSTBOX_REFRESH_MAX_CONCURRENT_PROBES}
    deliveredGraceDays = 3
    deliveredGraceDays = ${?POSTBOX_REFRESH_DELIVERED_GRACE_DAYS}
  }
  carriers {
    dhl {
      connectTimeoutMs = 5000
      connectTimeoutMs = ${?POSTBOX_CARRIER_DHL_CONNECT_TIMEOUT_MS}
      socketTimeoutMs = 10000
      socketTimeoutMs = ${?POSTBOX_CARRIER_DHL_SOCKET_TIMEOUT_MS}
      requestTimeoutMs = 10000
      requestTimeoutMs = ${?POSTBOX_CARRIER_DHL_REQUEST_TIMEOUT_MS}
      userAgent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      userAgent = ${?POSTBOX_CARRIER_DHL_USER_AGENT}
      // DHL rate limit: 1 call per 5 s.
      minRequestIntervalMs = 5000
      minRequestIntervalMs = ${?POSTBOX_CARRIER_DHL_MIN_REQUEST_INTERVAL_MS}
    }
    ctt {
      connectTimeoutMs = 5000
      connectTimeoutMs = ${?POSTBOX_CARRIER_CTT_CONNECT_TIMEOUT_MS}
      socketTimeoutMs = 10000
      socketTimeoutMs = ${?POSTBOX_CARRIER_CTT_SOCKET_TIMEOUT_MS}
      requestTimeoutMs = 10000
      requestTimeoutMs = ${?POSTBOX_CARRIER_CTT_REQUEST_TIMEOUT_MS}
      userAgent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      userAgent = ${?POSTBOX_CARRIER_CTT_USER_AGENT}
      minRequestIntervalMs = 1000
      minRequestIntervalMs = ${?POSTBOX_CARRIER_CTT_MIN_REQUEST_INTERVAL_MS}
    }
    postnl {
      connectTimeoutMs = 5000
      connectTimeoutMs = ${?POSTBOX_CARRIER_POSTNL_CONNECT_TIMEOUT_MS}
      socketTimeoutMs = 10000
      socketTimeoutMs = ${?POSTBOX_CARRIER_POSTNL_SOCKET_TIMEOUT_MS}
      requestTimeoutMs = 10000
      requestTimeoutMs = ${?POSTBOX_CARRIER_POSTNL_REQUEST_TIMEOUT_MS}
      userAgent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      userAgent = ${?POSTBOX_CARRIER_POSTNL_USER_AGENT}
      minRequestIntervalMs = 1000
      minRequestIntervalMs = ${?POSTBOX_CARRIER_POSTNL_MIN_REQUEST_INTERVAL_MS}
    }
    dpd {
      connectTimeoutMs = 5000
      connectTimeoutMs = ${?POSTBOX_CARRIER_DPD_CONNECT_TIMEOUT_MS}
      socketTimeoutMs = 10000
      socketTimeoutMs = ${?POSTBOX_CARRIER_DPD_SOCKET_TIMEOUT_MS}
      requestTimeoutMs = 10000
      requestTimeoutMs = ${?POSTBOX_CARRIER_DPD_REQUEST_TIMEOUT_MS}
      userAgent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      userAgent = ${?POSTBOX_CARRIER_DPD_USER_AGENT}
      minRequestIntervalMs = 1000
      minRequestIntervalMs = ${?POSTBOX_CARRIER_DPD_MIN_REQUEST_INTERVAL_MS}
    }
    paack {
      connectTimeoutMs = 5000
      connectTimeoutMs = ${?POSTBOX_CARRIER_PAACK_CONNECT_TIMEOUT_MS}
      socketTimeoutMs = 10000
      socketTimeoutMs = ${?POSTBOX_CARRIER_PAACK_SOCKET_TIMEOUT_MS}
      requestTimeoutMs = 10000
      requestTimeoutMs = ${?POSTBOX_CARRIER_PAACK_REQUEST_TIMEOUT_MS}
      userAgent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      userAgent = ${?POSTBOX_CARRIER_PAACK_USER_AGENT}
      minRequestIntervalMs = 1000
      minRequestIntervalMs = ${?POSTBOX_CARRIER_PAACK_MIN_REQUEST_INTERVAL_MS}
    }
    ecoscooting {
      connectTimeoutMs = 5000
      connectTimeoutMs = ${?POSTBOX_CARRIER_ECOSCOOTING_CONNECT_TIMEOUT_MS}
      socketTimeoutMs = 10000
      socketTimeoutMs = ${?POSTBOX_CARRIER_ECOSCOOTING_SOCKET_TIMEOUT_MS}
      requestTimeoutMs = 10000
      requestTimeoutMs = ${?POSTBOX_CARRIER_ECOSCOOTING_REQUEST_TIMEOUT_MS}
      userAgent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      userAgent = ${?POSTBOX_CARRIER_ECOSCOOTING_USER_AGENT}
      minRequestIntervalMs = 1000
      minRequestIntervalMs = ${?POSTBOX_CARRIER_ECOSCOOTING_MIN_REQUEST_INTERVAL_MS}
    }
  }
}
